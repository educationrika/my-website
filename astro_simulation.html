<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中学理科：地学 天体シミュレーター v7</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- レイアウトとデザイン (アプリ固有) --- */
        body {
            /* style.cssの基本設定を継承しつつ、アプリ用に上書き */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* スクロール防止 */
        }

        header {
            /* style.cssの共通ヘッダーをベースに、アプリ用に配置調整 */
            display: flex;
            align-items: center;
            justify-content: center;
            /* タイトルを中央に */
            padding: 10px 20px;
            flex-shrink: 0;
            position: relative;
        }

        /* メニューボタンは style.css の .menu-btn を使用 (absolute配置) */

        h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        h2 {
            margin: 0;
            font-size: 0.9rem;
            color: #bbdefb;
            font-weight: normal;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            max-width: none;
            /* index.htmlの制限を解除 */
            margin: 0;
            padding: 0;
        }

        /* サイドバー */
        .sidebar {
            width: 280px;
            background-color: #1e1e1e;
            /* カードと同じ色に */
            padding: 20px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .control-group h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: #42a5f5;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        /* 操作系ボタン (style.cssの .btn などを活用してもいいが、細かい調整があるので維持) */
        .nav-buttons {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .nav-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.1s;
        }

        .nav-btn:hover {
            background: #555;
        }

        .nav-btn:active {
            background: #222;
        }

        /* メニューに戻るボタン */
        .menu-btn {
            text-decoration: none;
            color: #fff;
            background-color: #444;
            /* ちょっと明るめのグレー */
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            border: 1px solid #666;
            margin-right: 15px;
            /* タイトルとの間隔 */
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }

        .menu-btn:hover {
            background-color: #555;
        }

        .menu-btn::before {
            content: "◀";
            margin-right: 6px;
            font-size: 0.8rem;
        }

        /* 観測者視点 (右下) */
        #human-view-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 320px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #human-view-container h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            font-weight: normal;
        }

        .sky-windows {
            display: flex;
            gap: 5px;
        }

        .sky-panel {
            flex: 1;
            height: 80px;
            border: 1px solid #444;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000;
        }

        .direction-tag {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            font-size: 10px;
            color: #ccc;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 0;
            font-weight: normal;
        }

        /* 空の色クラス */
        .sky-day {
            background: #4fc3f7;
            color: #333;
            text-shadow: none;
        }

        /* 昼の青空 */
        .sky-night {
            background: #000022;
        }

        /* 真っ暗な夜空 */
        .sky-evening-sky {
            background: linear-gradient(to bottom, #1a237e, #b71c1c);
        }

        /* 夕方の空 */
        .sky-morning-sky {
            background: linear-gradient(to bottom, #1a237e, #fbc02d);
        }

        /* 明け方の空 */
        .sky-sunset {
            background: linear-gradient(to bottom, #f57c00, #b71c1c);
        }

        /* 夕焼け（太陽方向） */
        .sky-sunrise {
            background: linear-gradient(to bottom, #4fc3f7, #fbc02d);
        }

        /* 朝焼け（太陽方向） */
        .selection-buttons button {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            border: 1px solid #333;
            background: #2c2c2c;
            color: #ccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: left;
            transition: background 0.2s;
        }

        .selection-buttons button:hover {
            background: #3a3a3a;
        }

        button.active {
            background: #d32f2f;
            border-color: #ff5252;
            color: #fff;
            font-weight: bold;
        }

        button.time-active {
            background: #1976d2;
            border-color: #448aff;
            color: #fff;
            font-weight: bold;
        }

        #info-box {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: auto;
        }

        #info-text {
            font-size: 15px;
            line-height: 1.5;
        }

        .highlight {
            color: #ffeb3b;
            font-weight: bold;
        }

        .main-view {
            flex: 1;
            background: radial-gradient(circle at center, #222 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        #simulationSvg {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 900px;
        }

        .star-label {
            fill: #ffeb3b;
            font-size: 18px;
            text-anchor: middle;
            font-weight: bold;
            text-shadow: 0 0 4px #000;
            pointer-events: none;
        }

        .direction-label {
            fill: #00ffff;
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            text-shadow: 0 0 3px #000;
        }

        /* 右上のミニビュー */
        #mini-view-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 240px;
            height: 160px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #mini-view-container h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            font-weight: normal;
        }

        #miniSvg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="menu-btn">メニュー</a>
        <div>
            <h1>中学理科：地学</h1>
            <h2>地球の公転・自転と星座の見え方</h2>
        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="control-group">
                <h3>1. 季節（公転）</h3>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="changeSeason(-1)">← 戻る</button>
                    <button class="nav-btn" onclick="changeSeason(1)">進む →</button>
                </div>
                <div class="selection-buttons">
                    <button onclick="setSeason('winter')" id="btn-winter">冬 (右)</button>
                    <button onclick="setSeason('spring')" id="btn-spring">春 (上)</button>
                    <button onclick="setSeason('summer')" id="btn-summer">夏 (左)</button>
                    <button onclick="setSeason('autumn')" id="btn-autumn">秋 (下)</button>
                </div>
            </div>
            <div class="control-group">
                <h3>2. 時刻（自転）</h3>
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="changeTime(-1)">← 戻る</button>
                    <button class="nav-btn" onclick="changeTime(1)">進む →</button>
                </div>
                <div class="selection-buttons">
                    <button onclick="setTime('noon')" id="btn-noon">昼 (12時)</button>
                    <button onclick="setTime('evening')" id="btn-evening">夕方 (18時)</button>
                    <button onclick="setTime('midnight')" id="btn-midnight">真夜中 (24時)</button>
                    <button onclick="setTime('morning')" id="btn-morning">明け方 (6時)</button>
                </div>
            </div>
            <div id="info-box">
                <div id="info-text">ボタンを押してシミュレーションを開始してください。</div>
            </div>
        </div>

        <div class="main-view">
            <svg viewBox="0 0 800 800" id="simulationSvg">
                <defs>
                    <linearGradient id="gradEarth" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="40%" stop-color="#fdd835" />
                        <stop offset="60%" stop-color="#1a237e" />
                    </linearGradient>
                    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#fff" opacity="0.7" />
                    </marker>
                </defs>
                <text x="730" y="405" class="star-label">オリオン座(冬)</text>
                <text x="400" y="70" class="star-label">しし座(春)</text>
                <text x="70" y="405" class="star-label">さそり座(夏)</text>
                <text x="400" y="740" class="star-label">ペガスス座(秋)</text>

                <g transform="translate(400,400)">
                    <circle r="45" fill="#ff9800" stroke="#ffeb3b" stroke-width="2" />
                    <text y="5" fill="#800" font-size="14" text-anchor="middle" font-weight="bold">太陽</text>
                </g>
                <circle cx="400" cy="400" r="240" fill="none" stroke="#555" stroke-dasharray="4,4" />
                <path d="M660,400 A260,260 0 0,0 400,140" fill="none" stroke="#555" stroke-width="2"
                    marker-end="url(#arrowHead)" opacity="0.5" />

                <g id="earthGroup">
                    <g id="earthBody">
                        <circle r="35" fill="url(#gradEarth)" stroke="#aaa" stroke-width="1" />
                        <path d="M 22,-22 A 30,30 0 0,0 -22,-22" fill="none" stroke="#fff" stroke-width="2"
                            marker-end="url(#arrowHead)" opacity="0.8" />
                    </g>
                    <g id="observerGroup">
                        <path d="M -140,0 A 140,140 0 0,1 140,0" fill="rgba(255,255,255,0.15)"
                            stroke="rgba(255,255,255,0.4)" stroke-width="1" />
                        <line x1="-140" y1="0" x2="140" y2="0" stroke="#00ffff" stroke-width="2" opacity="0.7" />
                        <circle cx="0" cy="-6" r="7" fill="#0f0" stroke="#000" />
                        <text x="0" y="-115" class="direction-label">南</text>
                        <text x="-120" y="-10" class="direction-label">東</text>
                        <text x="120" y="-10" class="direction-label">西</text>
                    </g>
                </g>
            </svg>


            <div id="mini-view-container">
                <h3>斜めからの視点</h3>
                <svg id="miniSvg" viewBox="0 0 300 200">
                    <defs>
                        <linearGradient id="gradMiniEarth" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="30%" stop-color="#fdd835" />
                            <stop offset="70%" stop-color="#1a237e" />
                        </linearGradient>
                    </defs>

                    <ellipse cx="150" cy="100" rx="130" ry="50" fill="none" stroke="#666" stroke-dasharray="3,3" />
                    <g transform="translate(150,100)">
                        <circle r="25" fill="#ff9800" stroke="#ffeb3b" stroke-width="1" />
                    </g>

                    <g id="miniEarthGroup">
                        <g transform="rotate(23.4)">
                            <line x1="0" y1="-28" x2="0" y2="28" stroke="#fff" stroke-width="1.5" opacity="0.8" />
                            <text x="0" y="-30" fill="#fff" font-size="10" text-anchor="middle">北</text>
                            <g id="miniEarthRotator">
                                <circle r="14" fill="url(#gradMiniEarth)" stroke="#aaa" stroke-width="0.5" />
                            </g>
                        </g>
                    </g>
                </svg>
            </div>

            <div id="human-view-container">
                <h3>観測者から見た空</h3>
                <div class="sky-windows">
                    <div class="sky-panel" id="view-east">
                        <span id="star-east"></span>
                        <div class="direction-tag">東</div>
                    </div>
                    <div class="sky-panel" id="view-south">
                        <span id="star-south"></span>
                        <div class="direction-tag">南</div>
                    </div>
                    <div class="sky-panel" id="view-west">
                        <span id="star-west"></span>
                        <div class="direction-tag">西</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSeason = 'winter';
        let currentTime = 'noon';

        const CX = 400;
        const CY = 400;
        const ORBIT_RADIUS = 240;

        const MINI_CX = 150;
        const MINI_CY = 100;
        const MINI_RX = 130;
        const MINI_RY = 50;

        const seasonOrder = ['winter', 'spring', 'summer', 'autumn'];
        const timeOrder = ['noon', 'evening', 'midnight', 'morning'];

        const seasonConfig = {
            'winter': { angle: 0, label: '冬' },
            'spring': { angle: 270, label: '春' },
            'summer': { angle: 180, label: '夏' },
            'autumn': { angle: 90, label: '秋' }
        };

        const timeConfig = {
            'noon': { offset: 0, label: '昼' },
            'evening': { offset: -90, label: '夕方' },
            'midnight': { offset: -180, label: '真夜中' },
            'morning': { offset: -270, label: '明け方' }
        };

        // 星座の設定 (0:冬, 1:春, 2:夏, 3:秋)
        const constellations = ['オリオン座', 'しし座', 'さそり座', 'ペガスス座'];
        // 季節のインデックス
        const seasonIndices = { 'winter': 0, 'spring': 1, 'summer': 2, 'autumn': 3 };
        // 時間のオフセット（南中する星座のズレ）
        // 真夜中(0) -> その季節の星座が南中
        // 明け方(+1) -> +1つ先の季節の星座が南中
        // 夕方(-1 -> +3) -> 1つ前の季節の星座が南中
        // 昼(+2) -> 2つ先の季節（太陽の方向）
        const timeIndices = { 'midnight': 0, 'morning': 1, 'noon': 2, 'evening': 3 };

        function update() {
            const seasonData = seasonConfig[currentSeason];
            const timeData = timeConfig[currentTime];
            const angleRad = seasonData.angle * (Math.PI / 180);

            // --- 1. メインビュー更新 ---
            const ex = CX + ORBIT_RADIUS * Math.cos(angleRad);
            const ey = CY + ORBIT_RADIUS * Math.sin(angleRad);
            document.getElementById('earthGroup').setAttribute('transform', `translate(${ex}, ${ey})`);

            const earthBody = document.getElementById('earthBody');
            earthBody.setAttribute('transform', `rotate(${seasonData.angle})`);

            const sunDir = seasonData.angle + 180;
            const finalRot = sunDir + timeData.offset;
            document.getElementById('observerGroup').setAttribute('transform', `rotate(${finalRot + 90})`);

            // --- 2. ミニビュー更新 ---
            const miniEx = MINI_CX + MINI_RX * Math.cos(angleRad);
            const miniEy = MINI_CY + MINI_RY * Math.sin(angleRad);
            const miniEarthGroup = document.getElementById('miniEarthGroup');

            // 奥行きスケール
            const depthScale = 1 + (Math.sin(angleRad) * 0.2);
            miniEarthGroup.setAttribute('transform', `translate(${miniEx}, ${miniEy}) scale(${depthScale})`);

            // 昼夜の向き調整
            // 地軸の傾きGタグの中にいる球体だけを回す。
            // 地軸Gタグ自体が23.4度傾いているので、球体の回転角度(phase)は補正が必要だが、
            // 簡易的に公転角度の分だけ逆回転させて、常に太陽側を向かせる。
            // ※gradMiniEarthは左側が黄色。
            // rotate(-seasonData.angle) をかけると、公転角度に応じて向きが変わる
            const miniEarthRotator = document.getElementById('miniEarthRotator');
            miniEarthRotator.setAttribute('transform', `rotate(${seasonData.angle})`);

            // --- UI更新 ---
            document.querySelectorAll('button').forEach(b => {
                b.classList.remove('active'); b.classList.remove('time-active');
            });
            document.getElementById(`btn-${currentSeason}`).classList.add('active');
            document.getElementById(`btn-${currentTime}`).classList.add('time-active');

            document.getElementById('info-text').innerHTML =
                `<span class="highlight">${seasonData.label}</span>の<span class="highlight">${timeData.label}</span>の空を見ています。<br>` +
                getTimeDescription(timeData.label);

            updateHumanView();
        }

        function updateHumanView() {
            // 基本の色クラスをリセット
            const viewEast = document.getElementById('view-east');
            const viewSouth = document.getElementById('view-south');
            const viewWest = document.getElementById('view-west');
            [viewEast, viewSouth, viewWest].forEach(el => el.className = 'sky-panel');

            // --- 1. 空の色設定 ---
            // 明け方: 東は朝焼け、他は薄暗い
            // 夕方: 西は夕焼け、他は薄暗い
            // 昼: 全部青
            // 夜: 全部黒
            if (currentTime === 'noon') {
                [viewEast, viewSouth, viewWest].forEach(el => el.classList.add('sky-day'));
            } else if (currentTime === 'midnight') {
                [viewEast, viewSouth, viewWest].forEach(el => el.classList.add('sky-night'));
            } else if (currentTime === 'morning') {
                viewEast.classList.add('sky-sunrise');
                viewSouth.classList.add('sky-morning-sky');
                viewWest.classList.add('sky-morning-sky');
            } else if (currentTime === 'evening') {
                viewWest.classList.add('sky-sunset');
                viewSouth.classList.add('sky-evening-sky');
                viewEast.classList.add('sky-evening-sky');
            }

            // --- 2. 星座の表示 ---
            // 南に見える星座の計算
            const sIdx = seasonIndices[currentSeason];
            const tIdx = timeIndices[currentTime];

            // South Index = (Season + Time) % 4
            const southStarIdx = (sIdx + tIdx) % 4;
            const eastStarIdx = (southStarIdx + 1) % 4;
            const westStarIdx = (southStarIdx - 1 + 4) % 4;

            let southText = constellations[southStarIdx];
            let eastText = constellations[eastStarIdx];
            let westText = constellations[westStarIdx];

            // 太陽の影響による不可視判定
            if (currentTime === 'noon') {
                southText = ''; eastText = ''; westText = '';
            }
            if (currentTime === 'morning') {
                eastText = ''; // 太陽
            }
            if (currentTime === 'evening') {
                westText = ''; // 太陽
            }

            document.getElementById('star-south').textContent = southText;
            document.getElementById('star-east').textContent = eastText;
            document.getElementById('star-west').textContent = westText;
        }

        function changeSeason(direction) {
            let currentIndex = seasonOrder.indexOf(currentSeason);
            let nextIndex = (currentIndex + direction + seasonOrder.length) % seasonOrder.length;
            setSeason(seasonOrder[nextIndex]);
        }
        function changeTime(direction) {
            let currentIndex = timeOrder.indexOf(currentTime);
            let nextIndex = (currentIndex + direction + timeOrder.length) % timeOrder.length;
            setTime(timeOrder[nextIndex]);
        }
        function getTimeDescription(timeLabel) {
            if (timeLabel === '昼') return "太陽が見えています。星座は見えません。";
            if (timeLabel === '真夜中') return "太陽の反対側です。南の空に季節の星座がよく見えます。";
            if (timeLabel === '夕方') return "太陽が西へ沈んでいくところです。";
            if (timeLabel === '明け方') return "太陽が東から昇ってくるところです。";
            return "";
        }
        function setSeason(s) { currentSeason = s; update(); }
        function setTime(t) { currentTime = t; update(); }

        update();
    </script>
</body>

</html>
